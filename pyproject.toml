[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0.4"]
build-backend = "scikit_build_core.build"

[project]
name = "pythoncdt"
version = "2.0.0"
description = "Python bindings for CDT: constrained Delaunay triangulation"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Artem Amirkhanov" }]
requires-python = ">=3.10"
dependencies = ["numpy"]
keywords = [
    "cdt",
    "computational-geometry",
    "conforming",
    "constrained",
    "constrained-delaunay-triangulation",
    "delaunay",
    "delaunay-triangulation",
    "fast",
    "refinement",
    "robust",
    "triangle",
    "triangulation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/artem-ogre/PythonCDT"
Issues = "https://github.com/artem-ogre/PythonCDT/issues"
CDT = "https://github.com/artem-ogre/CDT"

[dependency-groups]
test = ["pytest>=9", "pytest-run-parallel"]

[tool.scikit-build]
minimum-version = "build-system.requires"
install.components = ["python"]
sdist.exclude = ["CDT/docs", "CDT/CDT/tests"]

[tool.pytest]
addopts = ["-ra"]
strict = true
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.cibuildwheel]
test-groups = ["test"]
test-command = "pytest {project}/tests"

[tool.cibuildwheel.windows]
# 32-bit is skipped: pybind11's structured dtypes crash it on free-threaded Python (pybind/pybind11#6196)
archs = ["AMD64"]
