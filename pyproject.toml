[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "ninja",
    "cmake>=3.12",
]
build-backend = "setuptools.build_meta"

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
testpaths = ["cdt_bindings_test.py"]

[tool.cibuildwheel]
test-command = "pytest cdt_bindings_test.py"
test-sources = ["cdt_bindings_test.py", "CDT/visualizer/data"]  # the tests read input files by paths relative to the project
test-extras = ["test"]
test-requires = ["numpy"]  # the tests import numpy; the test extra holds only pytest
test-skip = ["*universal2:arm64"]
# Setuptools bug causes collision between pypy and cpython artifacts
before-build = "rm -rf {project}/build"
